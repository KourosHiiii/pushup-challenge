name: Build Android APK (Capacitor)

# بیلد اپ آفلاین اندروید:
# 1) خروجی استاتیک Next.js (بدون API — داده‌ها در localStorage)
# 2) wrap با Capacitor + پلاگین نوتیفیکیشن لوکال
# 3) APK در Releases و Artifacts

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # SDK اندروید روی رانرهای ubuntu-latest از قبل نصب است — فقط لایسنس‌ها را تأیید کن
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      # ── مرحله ۱: نصب وابستگی‌ها ──
      - name: Install dependencies
        run: npm install

      # ── مرحله ۲: بیلد استاتیک Next.js ──
      # مسیرهای API سرور با export سازگار نیستند → موقتاً جابه‌جا می‌شوند
      - name: Build static web app
        run: |
          mv src/app/api /tmp/api-backup
          STATIC_EXPORT=true npm run build
          mv /tmp/api-backup src/app/api
          ls out | head -20

      # ── مرحله ۳: افزودن پلتفرم اندروید ──
      - name: Setup Capacitor Android
        run: |
          npx cap add android
          npx cap sync android

      # ── مرحله ۴: آیکون و اسپلش اندروید از لوگوی اپ ──
      - name: Generate Android icons
        run: |
          npm install -D @capacitor/assets
          npx @capacitor/assets generate --android --assetPath assets || echo "icon generation skipped"
          npx cap sync android

      # ── مرحله ۵: بیلد APK ──
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      # ── مرحله ۶: انتشار در Releases ──
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pushup-challenge-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: PushUp Challenge APK v1.0.${{ github.run_number }}
          body: |
            📲 **اپ اندروید چالش ۳۰ روزه شنا سوئدی**

            - کاملاً آفلاین — داده‌ها روی خود گوشی
            - یادآوری روزانه با نوتیفیکیشن و صدا
            - استریک، XP، سطح‌بندی و ۱۴ نشان

            فایل APK را دانلود و نصب کنید (اجازه نصب از منابع ناشناس را بدهید).
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
